services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.combined
    ports:
      - '80:80'
    env_file:
      - .env
    environment:
      - SERVER_PORT=8090
      - VINEXT_PORT=3000
      - UPLOAD_DIR=/app/uploads
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s