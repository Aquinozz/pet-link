services:
  - type: web
    name: zoop
    runtime: docker
    repo: https://github.com/Aquinozz/pet-link.git
    plan: free
    dockerfilePath: ./Dockerfile.combined
    healthCheckPath: /
    envVars:
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://ep-restless-base-acgmcejn-pooler.sa-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
      - key: SPRING_DATASOURCE_USERNAME
        value: neondb_owner
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_DATASOURCE_DRIVER_CLASS_NAME
        value: org.postgresql.Driver
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: SPRING_JPA_SHOW_SQL
        value: "false"
      - key: JWT_EXPIRATION
        value: "900000"
      - key: JWT_SECRET
        sync: false
      - key: UPLOAD_DIR
        value: /app/uploads
      - key: SERVER_PORT
        value: "8090"
      - key: JAVA_OPTS
        value: -Xmx256m -XX:MaxRAMPercentage=50
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false